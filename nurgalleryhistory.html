<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUR ISLAM Image Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Bebas+Neue&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAV -->
<nav>
  <div class="logo">NUR<span>ISLAM</span>GALLERY</div>
  <ul class="nav-links">
    <li><a href="#">Curated</a></li>
    <li><a href="#">Collections</a></li>
    <li><a href="#">Artists</a></li>
    <li><a href="#">About</a></li>
  </ul>
  <div class="nav-search">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:#5a5850">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" placeholder="Search images...">
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-content">
    <div class="hero-eyebrow">— Curated Visual Stories —</div>
    <h1 class="hero-title">The Art of<br><em>Seeing</em></h1>
    <p class="hero-sub">A gallery of extraordinary moments, captured in light.</p>
  </div>
  <div class="hero-scroll">
    <div class="scroll-line"></div>
    Scroll
  </div>
</section>

<!-- FILTERS -->
<section class="filters-section">
  <span class="section-label">— 48 Images</span>
  <div class="filter-pills">
    <button class="pill active" onclick="filterGallery('all', this)">All</button>
    <button class="pill" onclick="filterGallery('nature', this)">Nature</button>
    <button class="pill" onclick="filterGallery('urban', this)">Urban</button>
    <button class="pill" onclick="filterGallery('portrait', this)">Portrait</button>
    <button class="pill" onclick="filterGallery('abstract', this)">Abstract</button>
  </div>
  <div class="view-toggle">
    <button class="view-btn active" title="Grid" onclick="setView('grid', this)">⊞</button>
    <button class="view-btn" title="Masonry" onclick="setView('masonry', this)">⊟</button>
    <button class="view-btn" title="List" onclick="setView('list', this)">☰</button>
  </div>
</section>

<!-- GALLERY -->
<section class="gallery-section">
  <div class="gallery-grid" id="gallery"></div>
</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <button class="lightbox-nav lb-prev" onclick="navigateLightbox(-1)">‹</button>
  <div class="lightbox-inner">
    <div class="lightbox-img-wrap">
      <img class="lightbox-img" id="lb-img" src="" alt="">
    </div>
    <div class="lightbox-info">
      <div class="lb-category" id="lb-cat"></div>
      <div class="lb-title" id="lb-title"></div>
      <div class="lb-desc" id="lb-desc"></div>
      <div class="lb-divider"></div>
      <div class="lb-stats">
        <div class="lb-stat"><div class="lb-stat-num" id="lb-views">—</div><div class="lb-stat-label">Views</div></div>
        <div class="lb-stat"><div class="lb-stat-num" id="lb-likes">—</div><div class="lb-stat-label">Likes</div></div>
        <div class="lb-stat"><div class="lb-stat-num" id="lb-saves">—</div><div class="lb-stat-label">Saves</div></div>
      </div>
      <button class="lb-btn">↓ Download Full Res</button>
    </div>
  </div>
  <button class="lightbox-nav lb-next" onclick="navigateLightbox(1)">›</button>
</div>

<footer>
  <div class="footer-logo">LUMIÈRE</div>
  <div class="footer-copy">© 2026 Lumière Gallery · All rights reserved</div>
</footer>

<script>
const images = [
  { id:1, src:"https://picsum.photos/seed/a1/800/900", cat:"nature", title:"Morning Mist", desc:"Ethereal fog drifts through ancient cedar forests at golden hour.", views:"12.4K", likes:"834", saves:"291", class:"tall" },
  { id:2, src:"https://picsum.photos/seed/b2/1200/700", cat:"urban", title:"City Pulse", desc:"The relentless rhythm of metropolitan life captured in a single frame.", views:"9.1K", likes:"612", saves:"188", class:"wide" },
  { id:3, src:"https://picsum.photos/seed/c3/600/700", cat:"portrait", title:"Reverie", desc:"A fleeting moment of quiet contemplation in a world of noise.", views:"18.2K", likes:"1.2K", saves:"445", class:"" },
  { id:4, src:"https://picsum.photos/seed/d4/700/800", cat:"abstract", title:"Chromatic Drift", desc:"Colours bleed and bloom in an exploration of pure sensation.", views:"7.6K", likes:"501", saves:"167", class:"" },
  { id:5, src:"https://picsum.photos/seed/e5/1400/900", cat:"nature", title:"Horizon Burn", desc:"The sun surrenders to the sea in an explosion of amber and violet.", views:"22.8K", likes:"1.9K", saves:"703", class:"featured" },
  { id:6, src:"https://picsum.photos/seed/f6/700/700", cat:"urban", title:"Glass & Steel", desc:"Architecture as sculpture — light bends through engineered canyons.", views:"11.3K", likes:"780", saves:"244", class:"" },
  { id:7, src:"https://picsum.photos/seed/g7/700/700", cat:"portrait", title:"Solitude", desc:"In stillness, the most profound truths reveal themselves.", views:"15.5K", likes:"1.0K", saves:"389", class:"" },
  { id:8, src:"https://picsum.photos/seed/h8/900/700", cat:"nature", title:"Deep Green", desc:"Ancient forests hold secrets only silence can unlock.", views:"8.9K", likes:"598", saves:"201", class:"wide" },
  { id:9, src:"https://picsum.photos/seed/i9/700/900", cat:"abstract", title:"Void", desc:"Where form dissolves and only essence remains.", views:"6.4K", likes:"443", saves:"142", class:"" },
  { id:10, src:"https://picsum.photos/seed/j10/700/700", cat:"urban", title:"Neon Rain", desc:"Wet cobblestones become mirrors for the city's electric dreams.", views:"20.1K", likes:"1.7K", saves:"598", class:"" },
  { id:11, src:"https://picsum.photos/seed/k11/700/900", cat:"portrait", title:"The Gaze", desc:"Eyes that carry the weight of a thousand untold stories.", views:"14.3K", likes:"967", saves:"334", class:"" },
  { id:12, src:"https://picsum.photos/seed/l12/700/700", cat:"nature", title:"First Light", desc:"Dawn breaks across mountain ridgelines like a slow revelation.", views:"16.7K", likes:"1.1K", saves:"412", class:"" },
];

let currentView = 'grid';
let currentFilter = 'all';
let currentIndex = 0;
let filtered = [...images];

function buildGallery() {
  filtered = currentFilter === 'all' ? [...images] : images.filter(i => i.cat === currentFilter);
  const grid = document.getElementById('gallery');
  grid.innerHTML = '';
  filtered.forEach((img, idx) => {
    const item = document.createElement('div');
    item.className = 'gallery-item ' + img.class;
    item.innerHTML = `
      <img class="item-img" src="${img.src}" alt="${img.title}" loading="lazy">
      <div class="item-overlay">
        <div class="item-title">${img.title}</div>
        <div class="item-meta">
          <span class="item-tag">${img.cat}</span>
          <div class="item-actions">
            <button class="action-btn" title="Like">♡</button>
            <button class="action-btn" title="Save">⊕</button>
            <button class="action-btn" title="Expand" onclick="openLightbox(${idx}); event.stopPropagation()">⤢</button>
          </div>
        </div>
      </div>
    `;
    item.addEventListener('click', () => openLightbox(idx));
    grid.appendChild(item);
  });
}

function filterGallery(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  buildGallery();
}

function setView(view, btn) {
  currentView = view;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const grid = document.getElementById('gallery');
  grid.className = 'gallery-grid ' + (view === 'grid' ? '' : view);
}

function openLightbox(idx) {
  currentIndex = idx;
  const img = filtered[idx];
  document.getElementById('lb-img').src = img.src;
  document.getElementById('lb-title').textContent = img.title;
  document.getElementById('lb-cat').textContent = '— ' + img.cat.toUpperCase();
  document.getElementById('lb-desc').textContent = img.desc;
  document.getElementById('lb-views').textContent = img.views;
  document.getElementById('lb-likes').textContent = img.likes;
  document.getElementById('lb-saves').textContent = img.saves;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function navigateLightbox(dir) {
  currentIndex = (currentIndex + dir + filtered.length) % filtered.length;
  openLightbox(currentIndex);
}

document.getElementById('lightbox').addEventListener('click', function(e) {
  if (e.target === this) closeLightbox();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navigateLightbox(-1);
  if (e.key === 'ArrowRight') navigateLightbox(1);
});

// Like / save button toggle
document.addEventListener('click', e => {
  if (e.target.classList.contains('action-btn') && e.target.title === 'Like') {
    e.target.textContent = e.target.textContent === '♡' ? '♥' : '♡';
    e.target.style.background = e.target.textContent === '♥' ? '#c9a96e' : '';
  }
});

buildGallery();
</script>
</body>
</html>
